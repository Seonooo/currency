spring:
  application:
    name: currency
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/currency?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

server:
  port: 8080
logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG